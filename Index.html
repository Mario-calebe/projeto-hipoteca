<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hipoteca</title>
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="stylesheet" href="estilos/desktop.css">
    <link rel="shortcut icon" href="images/favicon-32x32.png" type="image/x-icon">
</head>
<body>
    <main>
        <section id="calculator">
            <header>
                <h1>Mortgage Calculator</h1>
                <a href="#">Clear All</a>
            </header>
            <form action="">
                <div class="cal">
                <label for="mort-amount">Mortgage Amount</label>
                    <div class="LibraEsterlina">
                        <label for="mort-amount" id="libra">£</label>
                        <input type="number" name="mortgage-amount" id="mort-amount">
                    </div>
                </div>
                <div class="cal-desk">
                    <div class="cal">
                        <label for="mort-term">Mortgage Term</label>
                        <div class="years">
                            <label for="mort-term" id="y">years</label>
                            <input type="number" name="mortgage-term" id="mort-term">
                        </div>
                    </div>
                    <div class="cal">
                            <label for="rate">Interest Rate</label>
                        <div class="por-rate">
                            <label for="rate" id="porcent">%</label>
                            <input type="number" name="interest-rate" id="rate">
                        </div>
                    </div>
                </div>
                <div class="type">
                    <p>Mortgage Type</p>
                    <div>
                        
                        <label for="repay"><input type="radio" name="mort-type" id="repay"><span>Repayment</span></label>
                    </div>
                    <div>
                        <label for="interest-only"><input type="radio" name="mort-type" id="interest-only">    <span>Interest Only</span></label>
                    </div>
                    <p id="submit">
                        <img src="images/icon-calculator.svg" alt="">
                        <input type="submit" value="Calculate Rapayments">
                    </p>
                </div>
            </form>
        </section>
        <section id="result">
            <div class="illu">
                
            </div>
            <h1>Results shown here</h1>
            <p>Complete the form and click "calculate repayments" to see what your monthly repayments would be.</p>
        </section>
    </main>
</body>
</html>
