<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hipoteca</title>
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="stylesheet" href="estilos/desktop.css">
    <link rel="shortcut icon" href="images/favicon-32x32.png" type="image/x-icon">
</head>
<body>
    <main>
        <section id="calculator">
            <header>
                <h1>Mortgage Calculator</h1>
                <a href="#" onclick="Clear()">Clear All</a>
            </header>
            <form action="">
                <div class="cal">
                    <label for="mort-amount">Mortgage Amount</label>
                    <div class="LibraEsterlina required">
                        <label for="mort-amount" id="libra" class="required">£</label>
                        <input type="number" name="mortgage-amount" id="mort-amount" required>
                    </div>
                    <p class="required">This field is required</p>
                </div>
                <div class="cal-desk">
                    <div class="cal">
                        <label for="mort-term">Mortgage Term</label>
                        <div class="years required">
                            <label for="mort-term" id="y" class="required">years</label>
                            <input type="number" name="mortgage-term" id="mort-term" required>
                        </div>
                        <p class="required">This field is required</p>
                    </div>
                    <div class="cal">
                        <label for="rate">Interest Rate</label>
                        <div class="por-rate required">
                            <label for="rate" id="porcent" class="required">%</label>
                            <input type="number" name="interest-rate" id="rate" required>
                        </div>
                        <p class="required">This field is required</p>
                    </div>
                </div>
                <div class="type">
                    <p>Mortgage Type</p>
                        <label for="repay"><input type="radio" name="mort-type" id="repay"><span>Repayment</span></label>
                        <label for="interest-only"><input type="radio" name="mort-type" id="interest-only">    <span>Interest Only</span></label>
                    <p class="required">This field is required</p>
                    <p id="submit" onclick="Calcular()">
                        <img src="images/icon-calculator.svg" alt="">
                        <button id="calculate">Calculate Rapayments</button>
                    </p>
                </div>
            </form>
        </section>
        <section id="result">
            <div class="illu">
                
            </div>
            <h1>Results shown here</h1>
            <p>Complete the form and click "calculate repayments" to see what your monthly repayments would be.</p>
        </section>
    </main>
</body>
<script src="script.js"></script>
</html>
